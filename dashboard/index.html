<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Radar de Integridade ANS</title>
<meta name="description" content="Projeto Transforma: cruzamento mensal da rede hospitalar registrada na ANS com a Rede Nacional de Prestadores (RNP), triagem das divergências e indicadores.">
<link rel="icon" type="image/svg+xml" href="img/radar-icone-app.svg">
<link rel="icon" type="image/png" sizes="32x32" href="img/radar-icone-32.png">
<link rel="apple-touch-icon" href="img/radar-icone-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 64 64" width="24" height="24" aria-hidden="true"><circle cx="32" cy="32" r="27" fill="none" stroke="currentColor" stroke-width="4"/><circle cx="32" cy="32" r="15.5" fill="none" stroke="currentColor" stroke-width="2.5" opacity=".45"/><path d="M32 32 L32 5 A27 27 0 0 1 55.4 18.5 Z" fill="#b1d34b" opacity=".3"/><path d="M32 32 L55.4 18.5" stroke="#b1d34b" stroke-width="4" stroke-linecap="round"/><circle cx="32" cy="32" r="4" fill="currentColor"/><path d="M36.5 44.5 l4.6 4.6 l9.4 -10" fill="none" stroke="#b1d34b" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <div><b>Radar de Integridade ANS</b><span>Conferência ANS × RNP · rede hospitalar</span></div>
    </div>
    <div class="ctx"><span class="ctx" id="ctx"></span>
    <button class="icon-btn" id="theme" aria-label="Alternar tema claro ou escuro" title="Alternar tema"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button></div>
  </div>
  <nav class="tabs" role="tablist" aria-label="Etapas do ciclo mensal">
    <button class="tab" role="tab" id="t-bases" data-view="bases" aria-controls="v-bases"><span class="step">1</span>Bases</button>
    <button class="tab" role="tab" id="t-triagem" data-view="triagem" aria-controls="v-triagem"><span class="step">2</span>Triagem <span class="badge" id="badge-triagem" hidden></span></button>
    <button class="tab" role="tab" id="t-fechamento" data-view="fechamento" aria-controls="v-fechamento"><span class="step">3</span>Fechamento</button>
    <span class="sep" aria-hidden="true"></span>
    <button class="tab" role="tab" id="t-indicadores" data-view="indicadores" aria-controls="v-indicadores">Indicadores</button>
    <button class="tab" role="tab" id="t-regras" data-view="regras" aria-controls="v-regras">Regras</button>
  </nav>
</header>
<main>
  <section class="view" id="v-bases" role="tabpanel" aria-labelledby="t-bases" hidden></section>
  <section class="view" id="v-triagem" role="tabpanel" aria-labelledby="t-triagem" hidden></section>
  <section class="view" id="v-fechamento" role="tabpanel" aria-labelledby="t-fechamento" hidden></section>
  <section class="view" id="v-indicadores" role="tabpanel" aria-labelledby="t-indicadores" hidden></section>
  <section class="view" id="v-regras" role="tabpanel" aria-labelledby="t-regras" hidden></section>
</main>
<div class="scrim" id="scrim" hidden></div>
<aside class="detail" id="detail" hidden aria-label="Detalhe do caso"></aside>
<script src="js/regras.js"></script>
<script src="js/engine.js"></script>
<script src="js/demo.js"></script>
<script src="js/io.js"></script>
<script src="js/app.js"></script>
</body>
</html>
